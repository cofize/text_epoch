<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Определитель эпохи текста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e6eaec;
  --panel: #f6f8f9;
  --ink: #1c2b33;
  --muted: #566871;
  --line: #c3ccd1;
  --xviii: #b9770e;
  --xix: #1f7a74;
  --xx: #a8324a;
  --xviii-bg: #b9770e26;
  --xix-bg: #1f7a7426;
  --xx-bg: #a8324a24;
  --serif: "Source Serif 4", "PT Serif", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121b20;
    --panel: #1a262c;
    --ink: #e3eaed;
    --muted: #92a5ae;
    --line: #34454d;
    --xviii: #e0a53c;
    --xix: #4fb8ae;
    --xx: #e0708a;
    --xviii-bg: #e0a53c2e;
    --xix-bg: #4fb8ae2b;
    --xx-bg: #e0708a2e;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--sans);
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }
header { margin-bottom: 32px; max-width: 62ch; }
h1 {
  font: 600 clamp(30px, 4.4vw, 46px)/1.1 var(--serif);
  letter-spacing: -0.01em;
  margin: 0 0 12px;
}
header p { margin: 0; color: var(--muted); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 20px;
}
h2 { font: 600 15px/1.3 var(--sans); margin: 0 0 12px; }

label.sr { position: absolute; left: -9999px; }
textarea {
  width: 100%;
  min-height: 260px;
  resize: vertical;
  padding: 14px;
  font: 400 18px/1.55 var(--serif);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
}
textarea:focus-visible, button:focus-visible, .sample:focus-visible, .chip:focus-visible {
  outline: 2px solid var(--xix);
  outline-offset: 2px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.count.over { color: var(--xx); font-weight: 600; }
button.primary {
  font: 600 15px var(--sans);
  color: #fff;
  background: var(--ink);
  border: 0;
  border-radius: 4px;
  padding: 11px 20px;
  cursor: pointer;
}
:root:not([data-theme="light"]) button.primary { color: var(--bg); }
button.primary:disabled { opacity: .55; cursor: progress; }

.samples { margin: 16px 0 0; font-size: 14px; color: var(--muted); }
.sample {
  font: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin-right: 14px;
  color: var(--ink);
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
  cursor: pointer;
}
.sample[data-p="xviii"] { text-decoration-color: var(--xviii); }
.sample[data-p="xix"] { text-decoration-color: var(--xix); }
.sample[data-p="xx"] { text-decoration-color: var(--xx); }

.empty { color: var(--muted); margin: 0; max-width: 46ch; }
.error {
  border-left: 3px solid var(--xx);
  padding: 10px 14px;
  background: var(--xx-bg);
  border-radius: 0 4px 4px 0;
}
.error b { display: block; }

.verdict-label { color: var(--muted); font-size: 14px; margin: 0; }
.verdict {
  font: 600 clamp(30px, 4vw, 42px)/1.1 var(--serif);
  margin: 2px 0 4px;
}
.verdict.xviii { color: var(--xviii); }
.verdict.xix { color: var(--xix); }
.verdict.xx { color: var(--xx); }
.conf { color: var(--muted); margin: 0 0 18px; }
.warn { color: var(--ink); background: var(--xviii-bg); padding: 8px 12px; border-radius: 4px; margin: 0 0 18px; font-size: 14px; }

.strip { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); gap: 2px; }
.strip i { display: block; min-width: 3px; }
.strip i.xviii { background: var(--xviii); }
.strip i.xix { background: var(--xix); }
.strip i.xx { background: var(--xx); }
.strip-legend { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 22px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.strip-legend span.top { color: var(--ink); font-weight: 600; }

.text-out {
  font: 400 18px/1.75 var(--serif);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0 0 22px;
  padding: 14px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
}
mark { color: inherit; padding: 1px 0; border-radius: 2px; border-bottom: 2px solid; }
mark.xviii { background: var(--xviii-bg); border-color: var(--xviii); }
mark.xix { background: var(--xix-bg); border-color: var(--xix); }
mark.xx { background: var(--xx-bg); border-color: var(--xx); }
mark.flash { outline: 2px solid var(--ink); outline-offset: 1px; }

.markers { list-style: none; margin: 0; padding: 0; }
.markers li { border-top: 1px solid var(--line); }
.chip {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  gap: 4px 10px;
  align-items: baseline;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 10px 2px;
  cursor: pointer;
}
.dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
.dot.xviii { background: var(--xviii); }
.dot.xix { background: var(--xix); }
.dot.xx { background: var(--xx); }
.chip .w { font: 600 17px var(--serif); overflow-wrap: anywhere; }
.chip .n { color: var(--muted); font-size: 13px; }
.chip .note { grid-column: 2 / 4; color: var(--muted); font-size: 14px; }
.no-markers { color: var(--muted); margin: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Определитель эпохи текста</h1>
    <p>Вставьте отрывок на русском языке. Сервис назовёт век, к которому он ближе всего, и подсветит слова и написания, по которым это видно.</p>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="in-h">
      <h2 id="in-h">Текст</h2>
      <label class="sr" for="text">Текст для анализа</label>
      <textarea id="text" placeholder="Вставьте сюда отрывок…" spellcheck="false"></textarea>
      <div class="row">
        <span class="count" id="count">0 / 20000</span>
        <button class="primary" id="go" type="button">Определить эпоху</button>
      </div>
      <p class="samples">Примеры:
        <button class="sample" type="button" data-p="xviii" data-i="0">XVIII век</button>
        <button class="sample" type="button" data-p="xix" data-i="1">XIX век</button>
        <button class="sample" type="button" data-p="xx" data-i="2">XX век</button>
      </p>
    </section>

    <section class="panel" aria-labelledby="out-h" aria-live="polite">
      <h2 id="out-h">Результат</h2>
      <div id="out"><p class="empty">Здесь появится вердикт и текст с подсветкой. Нажмите «Определить эпоху» или Ctrl+Enter.</p></div>
    </section>
  </div>
</div>

<script>
const API_URL = "/api/analyze";
const MAX_LEN = 20000;
const LABELS = { xviii: "XVIII век", xix: "XIX век", xx: "XX век и позже" };
const ORDER = ["xviii", "xix", "xx"];

const SAMPLES = [
  "Сей же час, сударь мой, государыня ея величество повелела, дабы оный указ был исполнен, ибо отечество того требует.",
  "Барин приказал подать экипаж, и лакей, извольте-с, побежал на станцию, где строилась чугунка.",
  "Товарищ председатель колхоза объявил, что трактор прибудет с завода к пятилетке, а вечером в клубе покажут кино."
];

const $ = (id) => document.getElementById(id);
const ta = $("text"), out = $("out"), go = $("go"), count = $("count");

function updateCount() {
  const n = ta.value.length;
  count.textContent = n + " / " + MAX_LEN;
  count.classList.toggle("over", n > MAX_LEN);
}
ta.addEventListener("input", updateCount);
ta.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) analyze();
});
document.querySelectorAll(".sample").forEach((b) =>
  b.addEventListener("click", () => {
    ta.value = SAMPLES[+b.dataset.i];
    updateCount();
    analyze();
  })
);
go.addEventListener("click", analyze);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function detailText(d) {
  if (typeof d === "string") return d;
  if (Array.isArray(d) && d.length) return d.map((x) => x.msg).join("; ");
  return "Попробуйте ещё раз.";
}

function showError(title, message) {
  out.replaceChildren();
  const box = el("div", "error");
  box.setAttribute("role", "alert");
  box.append(el("b", null, title), el("span", null, message));
  out.append(box);
}

async function analyze() {
  const text = ta.value;
  if (!text.trim()) return showError("Нет текста", "Введите или вставьте отрывок, чтобы определить эпоху.");
  if (text.length > MAX_LEN) return showError("Текст слишком длинный", "Сократите его до " + MAX_LEN + " знаков: сейчас " + text.length + ".");

  go.disabled = true;
  go.textContent = "Анализирую…";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, mode: "epoch" })
    });
    const data = await res.json();
    if (!res.ok) {
      const titles = { 400: "Не получилось разобрать текст", 422: "Текст не прошёл проверку" };
      return showError(titles[res.status] || "Ошибка сервера", detailText(data.detail));
    }
    render(text, data.result, data.meta);
  } catch (e) {
    showError("Нет связи с сервисом", "Проверьте, что сервер запущен, и повторите запрос.");
  } finally {
    go.disabled = false;
    go.textContent = "Определить эпоху";
  }
}

function render(text, d, meta) {
  out.replaceChildren();

  out.append(el("p", "verdict-label", "Вердикт"));
  const noSignal = d.uncertain && !(d.dated_markers || []).length;
  out.append(el("p", noSignal ? "verdict" : "verdict " + d.period,
    noSignal ? "Не удалось определить" : (d.period_label || LABELS[d.period])));
  out.append(el("p", "conf", (noSignal ? "Датирующих слов не найдено" : "Уверенность: " + Math.round(d.score * 100) + "%") +
    (meta ? " · " + meta.chars + " зн., " + meta.took_ms + " мс" : "")));
  if (d.uncertain) {
    out.append(el("p", "warn", "Датирующих слов найдено мало, поэтому вердикт ненадёжен. Попробуйте более длинный отрывок."));
  }

  if (d.stub) {
    out.append(el("p", "warn", "Сейчас вместо модели работает заглушка: она ищет слова из заранее составленного списка, поэтому на произвольных текстах часто не находит признаков."));
  }

  // полоса распределения по периодам
  const strip = el("div", "strip");
  strip.setAttribute("role", "img");
  strip.setAttribute("aria-label", ORDER.map((p) => LABELS[p] + " " + Math.round(d.all_scores[p] * 100) + "%").join(", "));
  const legend = el("div", "strip-legend");
  ORDER.forEach((p) => {
    const seg = el("i", p);
    seg.style.flex = String(Math.max(d.all_scores[p], 0.001));
    strip.append(seg);
    const s = el("span", p === d.period ? "top" : "", LABELS[p] + " " + Math.round(d.all_scores[p] * 100) + "%");
    legend.append(s);
  });
  out.append(strip, legend);

  // текст с подсветкой
  const markers = (d.dated_markers || []).slice().sort((a, b) => a.start - b.start);
  const body = el("div", "text-out");
  let pos = 0;
  markers.forEach((m, i) => {
    if (m.start < pos) return;
    if (m.start > pos) body.append(document.createTextNode(text.slice(pos, m.start)));
    const mk = el("mark", m.period, text.slice(m.start, m.end));
    mk.id = "mk-" + i;
    mk.title = m.note || m.kind;
    body.append(mk);
    pos = m.end;
  });
  if (pos < text.length) body.append(document.createTextNode(text.slice(pos)));
  out.append(body);

  // список признаков (одинаковые сворачиваем со счётчиком)
  out.append(el("h2", null, "Датирующие признаки"));
  if (!markers.length) {
    out.append(el("p", "no-markers", "Ни одного признака не найдено."));
    return;
  }
  const groups = new Map();
  markers.forEach((m, i) => {
    const key = m.text.toLowerCase() + "|" + m.period + "|" + m.note;
    if (!groups.has(key)) groups.set(key, { m, first: i, n: 0 });
    groups.get(key).n++;
  });
  const list = el("ul", "markers");
  [...groups.values()]
    .sort((a, b) => ORDER.indexOf(a.m.period) - ORDER.indexOf(b.m.period) || a.first - b.first)
    .forEach(({ m, first, n }) => {
      const li = el("li");
      const btn = el("button", "chip");
      btn.type = "button";
      btn.append(el("span", "dot " + m.period), el("span", "w", m.text), el("span", "n", n > 1 ? "×" + n : LABELS[m.period]));
      if (m.note) btn.append(el("span", "note", m.kind + ": " + m.note));
      btn.addEventListener("click", () => {
        const target = $("mk-" + first);
        if (!target) return;
        target.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
        target.classList.add("flash");
        setTimeout(() => target.classList.remove("flash"), 1200);
      });
      li.append(btn);
      list.append(li);
    });
  out.append(list);
}
</script>
</body>
</html>
